name: YNDR Registry Tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build registry
        run: python scripts/build_registry.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
